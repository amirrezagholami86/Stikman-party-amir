
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AMIRREZA STICKMAN PARTY</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111827;color:white;
 font-family:Arial,sans-serif;text-align:center;
 user-select:none;overflow-x:hidden
}
header{padding:22px;background:#172554}
h1{font-size:25px;color:#facc15;margin:5px}
small{color:#93c5fd}
button{
 border:0;border-radius:13px;padding:13px 18px;
 font-weight:bold;font-size:15px;cursor:pointer;
 background:#facc15;color:#111827;margin:5px
}
button:active{transform:scale(.95)}
.panel{
 background:#1e293b;border:1px solid #334155;
 border-radius:18px;margin:14px;padding:17px
}
select{padding:12px;border-radius:10px}
canvas{
 width:96%;max-width:850px;background:#86d5fa;
 border:4px solid white;border-radius:15px;
 touch-action:none
}
.hidden{display:none}
.controls{
 display:flex;justify-content:center;flex-wrap:wrap;
 gap:10px;margin:12px
}
.player{display:inline-block;padding:8px;color:#fff}
#message{color:#fde047;font-size:20px;font-weight:bold}
footer{padding:20px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>

<header>
<h1>⚡ AMIRREZA STICKMAN PARTY</h1>
<small>ULTIMATE EDITION • VERSION 1.0.0</small>
</header>

<section id="menu" class="panel">
<h2>🎮 منوی اصلی</h2>
<p>به دنیای بازی‌های استیکمنی خوش آمدید!</p>

<p>تعداد بازیکنان:</p>
<select id="count">
<option value="1">۱ بازیکن</option>
<option value="2">۲ بازیکن</option>
<option value="3">۳ بازیکن</option>
<option value="4">۴ بازیکن</option>
</select>

<p>انتخاب بازی:</p>
<button onclick="start('football')">⚽ فوتبال</button>
<button onclick="start('race')">🏃 مسابقه دو</button>
</section>

<section id="game" class="hidden">
<div class="panel">
<div id="info"></div>
<div id="message">آماده باشید!</div>
<canvas id="screen" width="800" height="450"></canvas>
<div class="controls" id="controls"></div>
<button onclick="restart()">🔄 شروع مجدد</button>
<button onclick="home()">🏠 منوی اصلی</button>
</div>
</section>

<footer>
AMIRREZA GHOLAMI © 2026
</footer>

<script>
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const colors=["#ef4444","#2563eb","#16a34a","#a855f7"];
let players=[],mode="football",running=false,frame=0;
let score=0,keys={};

function player(i){
 return {
 x:130+i*170,y:300,vx:0,vy:0,
 color:colors[i],points:0,dir:1
 };
}

function start(m){
 mode=m;
 document.getElementById("menu").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 restart();
}

function restart(){
 let n=+document.getElementById("count").value;
 players=Array.from({length:n},(_,i)=>player(i));
 score=0;frame=0;running=true;
 document.getElementById("message").textContent="بازی شروع شد!";
 document.getElementById("info").textContent=
 "بازیکنان: "+players.length+" | امتیاز: 0";
 makeControls();
 requestAnimationFrame(loop);
}

function makeControls(){
 const c=document.getElementById("controls");
 c.innerHTML="";
 players.forEach((p,i)=>{
  let b=document.createElement("button");
  b.textContent="بازیکن "+(i+1)+" ⬅➡";
  b.style.background=p.color;
  b.style.color="white";
  b.onpointerdown=()=>{
   keys[i]=true;
   p.vx=mode==="race"?4:5;
  };
  b.onpointerup=b.onpointerleave=()=>{
   keys[i]=false;p.vx=0;
  };
  c.appendChild(b);
 });
}

function stick(x,y,color){
 ctx.strokeStyle=color;ctx.lineWidth=6;
 ctx.lineCap="round";
 ctx.beginPath();ctx.arc(x,y-45,13,0,Math.PI*2);
 ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(x,y-32);ctx.lineTo(x,y+4);
 ctx.moveTo(x,y-20);ctx.lineTo(x-18,y-3);
 ctx.moveTo(x,y-20);ctx.lineTo(x+18,y-3);
 ctx.moveTo(x,y+4);ctx.lineTo(x-14,y+25);
 ctx.moveTo(x,y+4);ctx.lineTo(x+14,y+25);
 ctx.stroke();
}

function drawFootball(){
 ctx.fillStyle="#38a169";
 ctx.fillRect(0,0,800,450);
 ctx.strokeStyle="white";ctx.lineWidth=3;
 ctx.strokeRect(20,20,760,410);
 ctx.beginPath();ctx.arc(400,225,65,0,7);ctx.stroke();
 ctx.fillStyle="white";
 ctx.fillRect(15,160,15,130);
 ctx.fillRect(770,160,15,130);

 players.forEach(p=>{
  stick(p.x,p.y,p.color);
 });
 ctx.fillStyle="white";
 ctx.beginPath();ctx.arc(score%780+10,230,13,0,7);
 ctx.fill();
}

function drawRace(){
 ctx.fillStyle="#334155";
 ctx.fillRect(0,0,800,450);
 for(let y=0;y<450;y+=55){
  ctx.fillStyle="#facc15";
  ctx.fillRect(395,y+frame%55,10,25);
 }
 players.forEach((p,i)=>{
  stick(p.x,p.y,p.color);
  ctx.fillStyle="white";
  ctx.fillText("P"+(i+1),p.x-8,p.y+45);
 });
 ctx.fillStyle="white";
 ctx.fillRect(730,0,5,450);
}

function loop(){
 if(!running)return;
 frame++;
 ctx.clearRect(0,0,800,450);

 players.forEach((p,i)=>{
  p.x+=p.vx;
  p.x=Math.max(35,Math.min(765,p.x));
 });

 if(mode==="football")drawFootball();
 else drawRace();

 document.getElementById("info").textContent=
 "بازیکنان: "+players.length+" | زمان: "+Math.floor(frame/60);

 requestAnimationFrame(loop);
}

function home(){
 running=false;
 document.getElementById("game").classList.add("hidden");
 document.getElementById("menu").classList.remove("hidden");
}
</script>
</body>
</html>
